name: Codecov by Sentry

on:
  workflow_call:
    inputs:
      repository:
        description: The fully qualified name of the repository, including owner, e.g. codebeltnet/xunit.
        required: true
        type: string
      configuration:
        description: The path to the Codecov YAML configuration file.
        required: false
        type: string
        default: .codecov/codecov.yml
      ref:
        description: The branch, tag or SHA to check out. Omit to retain the triggering ref; independent of reporting branch and commit.
        required: false
        type: string
        default: ''
      branch:
        description: The reporting branch on Codecov. Omit to retain automatic detection; independent of checkout ref.
        required: false
        type: string
        default: ''
      commit:
        description: The reporting commit SHA on Codecov. Omit to retain automatic detection; independent of checkout ref.
        required: false
        type: string
        default: ''
      timeout-minutes:
        description: The maximum time in minutes to allow the job to run. Default is 15 minutes.
        required: false
        type: number
        default: 15
      fail-on-error:
        description: Fail the workflow when Codecov reports an upload or processing error. Default is false.
        required: false
        type: boolean
        default: false
    secrets:
      CODECOV_TOKEN:
        required: true

jobs:
  codecov:
    name: 📊 Code Coverage Analysis
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.timeout-minutes }}
    steps:
      - name: Checkout
        if: ${{ inputs.ref == '' }}
        uses: codebeltnet/git-checkout@v1

      - name: Checkout requested ref
        if: ${{ inputs.ref != '' }}
        uses: codebeltnet/git-checkout@v1
        with:
          ref: ${{ inputs.ref }}

      - name: Run CodeCov Analysis
        uses: codebeltnet/codecov-scan@v1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          repository: ${{ inputs.repository }}
          configuration: ${{ inputs.configuration }}
          branch: ${{ inputs.branch }}
          commit: ${{ inputs.commit }}
          fail-on-error: ${{ inputs.fail-on-error }}
